<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 1200px; height: 630px;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #160C08;
    color: #FBF8F1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 80px;
    position: relative;
    overflow: hidden;
  }
  .bg { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(120px); }
  .b1 { width: 600px; height: 600px; background: #C75A3D; top: -200px; left: -150px; opacity: .35; }
  .b2 { width: 500px; height: 500px; background: #F0B24A; bottom: -150px; right: -100px; opacity: .2; }
  .content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; justify-content: space-between; }
  .logo { font-size: 32px; font-weight: 800; letter-spacing: -.02em; }
  .logo span { color: #F0B24A; }
  h1 { font-size: 76px; font-weight: 800; letter-spacing: -.04em; line-height: 1; max-width: 900px; }
  h1 .accent { color: #F0B24A; }
  .tag { font-family: 'Courier New', monospace; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: rgba(240,178,74,.8); margin-bottom: 24px; }
</style></head><body>
  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
  <div class="content">
    <div class="logo">Mtaa<span>Link</span></div>
    <div>
      <div class="tag">Built in Kenya</div>
      <h1>Your organization, <span class="accent">finally in order.</span></h1>
    </div>
  </div>
</body></html>
